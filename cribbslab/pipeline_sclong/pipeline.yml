################################################################
#
# Pipeline pipeline_sclong configuration file
#
# 10x Genomics Single-cell long-read RNA-seq pipeline for nuclei sequencing
# Supports both 5' and 3' chemistries
# Handles both spliced and unspliced reads at gene and transcript levels
#
# Output count matrices include BOTH spliced and unspliced reads to capture
# the full transcriptome from nuclei.
#
################################################################

# -----------------------------------------------
# General settings
# -----------------------------------------------

projectname: sclong_rnaseq

# -----------------------------------------------
# Reference genome and annotation files
# -----------------------------------------------

# Path to reference genome fasta file
genome_fasta: /path/to/GRCh38.p14.genome.fa

# -----------------------------------------------
# 10x Kit Configuration
# -----------------------------------------------

# IMPORTANT: Set the correct kit type for your experiment
# Options:
#   3v3  - 10x Chromium 3' v3 chemistry (most common)
#   3v2  - 10x Chromium 3' v2 chemistry
#   5v2  - 10x Chromium 5' v2 chemistry
#   5v3  - 10x Chromium 5' v3 chemistry
#
# The kit type affects barcode/UMI position:
#   3' kits: barcode + UMI at 3' end (near poly-A)
#   5' kits: barcode + UMI at 5' end of read

tenx_kit: 3v3

# -----------------------------------------------
# BLAZE settings (cell barcode assignment)
# -----------------------------------------------

blaze:
    # 10x kit type (overrides tenx_kit if set)
    # Passed to BLAZE as --10x-kit-version
    # Options: 3v4, 3v3, 3v2, 5v3, 5v2
    kit: 3v3

    # Path to a CUSTOM barcode whitelist (optional).
    # Leave empty for standard 10x chemistry: BLAZE bundles the official 10x
    # whitelists and selects the right one automatically from the kit version.
    # Only set this if you used non-standard/custom barcodes
    # (passed to BLAZE as --full-bc-whitelist).
    whitelist: ''

    # Expected number of cells (helps with barcode filtering)
    expect_cells: 5000

    # Number of threads
    threads: 8

    # Memory per job
    memory: 16G

    # Additional options
    # --minQ: minimum base quality for barcode (default: 15)
    # --max-edit-distance: max edit distance for barcode matching
    options: ''

# -----------------------------------------------
# Minimap2 alignment settings
# -----------------------------------------------

minimap2:
    # Alignment options for single-cell long reads
    # -ax splice: spliced alignment for RNA-seq (maps to genome, captures both
    #   spliced and unspliced reads - unspliced align contiguously through introns)
    # -uf: consider forward strand transcripts only
    # -k14: k-mer size (14 works well for noisy long reads)
    options: '-ax splice -uf -k14'

    # GTF annotation used to generate a splice junction BED file (--junc-bed).
    # This improves splice site detection accuracy.
    # Falls back to featurecounts_gtf if not set.
    gtf: /path/to/gencode.v46.annotation.gtf.gz

    # Number of threads
    threads: 16

    # Memory per job
    memory: 8G

    # Per-thread memory for the samtools sort step (passed as `samtools sort -m`).
    # Total sort memory is roughly sort_memory * threads, so keep an eye on this
    # for large runs. Sort temp files are written next to the output BAM.
    # Lower this (not raise it) if the job is being OOM-killed.
    sort_memory: 1G

# -----------------------------------------------
# FLAMES settings (optional; smaller samples only)
# -----------------------------------------------
# Opt-in: set run: true and ``make flames``. Not part of ``make full``.
# Prefer IsoQuant for high cell-count libraries — FLAMES often OOMs there.

flames:
    # Must be true to run ``make flames``
    run: false

    # Path to annotation GTF file
    gtf: /path/to/gencode.v46.annotation.gtf.gz

    # Path to reference genome fasta (same as genome_fasta)
    fasta: /path/to/GRCh38.p14.genome.fa

    # Number of threads for parallel processing (lower if memory-limited)
    threads: 4

    # Memory per job (FLAMES can exceed 40G RSS on large nuclei samples)
    memory: 64G

    # Minimum number of reads to support a transcript
    min_support_reads: 3

    # Whether to perform transcript discovery
    do_discovery: TRUE

    # Minimum number of cells expressing a transcript
    min_cells: 3

# -----------------------------------------------
# featureCounts settings (gene-level quantification)
# -----------------------------------------------

featurecounts:
    # Path to annotation GTF file
    gtf: /path/to/gencode.v46.annotation.gtf.gz

    # Number of threads
    threads: 4

# -----------------------------------------------
# Combined counts settings (spliced + unspliced)
# -----------------------------------------------

# These settings control the combined count matrix generation
# which includes BOTH spliced and unspliced reads per gene/transcript.
# This is essential for nuclei sequencing where unspliced pre-mRNA is abundant.

combined:
    # Memory for combined counting
    memory: 32G

# -----------------------------------------------
# RNA velocity settings (separate spliced/unspliced)
# -----------------------------------------------

# These settings generate SEPARATE spliced and unspliced matrices
# for use with scVelo or velocyto trajectory analysis.

velocity:
    # GTF file (should include intron annotations for velocity)
    gtf: /path/to/gencode.v46.annotation.gtf.gz

    # Memory for velocity counting
    memory: 32G

# -----------------------------------------------
# QC settings
# -----------------------------------------------

nanoplot:
    # Keep low: for a single BAM, high thread counts inflate peak RAM
    # and often trigger BrokenProcessPool (OOM-killed workers).
    threads: 2

    # Memory per job (8G is too small for large nuclei BAMs)
    memory: 32G

    # Pass NanoPlot --huge (streaming mode for very large inputs)
    huge: true

    # Optional: cap reads used for plots/stats (e.g. 100000). Leave empty
    # / null to use all reads.
    downsample: null

    # Extra NanoPlot flags if needed
    options: ''

# -----------------------------------------------
# BAM tagging settings
# -----------------------------------------------

tag:
    # Memory for BAM tagging
    memory: 16G

# -----------------------------------------------
# IsoQuant settings (default discovery + quantification)
# -----------------------------------------------

# Primary transcript route for ``make full`` / ``make quantify``.
# Consumes the tagged genome BAM (CB/UB from BLAZE), does UMI dedup in
# single-cell mode, and by default constructs transcript models (novel
# isoforms of annotated genes). Novel *gene* discovery is not available
# in SC mode — use bulk IsoQuant or opt-in FLAMES for that.
#
# Note: IsoQuant single-cell UMI deduplication is believed to be
# edit-distance aware (Levenshtein ED3 for tenX_v3). This has not been
# verified against all installed versions; confirm before relying on it
# for low-UMI-diversity libraries.
#
# TODO: confirm whether the installed IsoQuant's UMI deduplication is
# truly edit-distance aware. ONT UMI error means exact-match-only dedup
# would inflate counts. The pre_collapse hook below (currently disabled)
# is reserved for a future upstream correction step if needed.

isoquant:
    # Path or name of the IsoQuant executable
    binary: isoquant.py

    # Single-cell mode. Controls UMI edit-distance deduplication threshold.
    # IsoQuant has no dedicated 10x 5' gene expression mode, but because
    # --barcoded_bam is used (barcodes read from CB tag, not called from
    # reads), the mode only affects the UMI ED threshold and UMI length
    # auto-detection from the BAM. The mapping is:
    #
    #   10x 3' v3  ->  tenX_v3        (16bp BC, 12bp UMI, ED3)
    #   10x 5' v3  ->  tenX_v3        (same BC+UMI structure, ED3 is correct)
    #   10x 3' v2  ->  tenX_v2_split  (16bp BC, 10bp UMI, ED3)
    #   10x 5' v2  ->  tenX_v3        (16bp BC, 10bp UMI; ED3 is acceptable,
    #                                   slightly permissive for a 10bp UMI)
    #
    # Use custom_sc with an MDF file if you need exact molecule-structure
    # matching for a non-standard chemistry.
    mode: tenX_v3

    # Path to annotation GTF file (used for --genedb)
    gtf: /path/to/gencode.v46.annotation.gtf.gz

    # Number of threads
    threads: 8

    # Memory per job
    memory: 64G

    # Skip transcript model construction (reference quantification only).
    # Leave false so IsoQuant discovers novel isoforms of annotated genes.
    no_model_construction: false

    # BAM tag carrying the cell barcode (must match tag written by tag_bam_barcodes.R)
    barcode_tag: CB

    # BAM tag carrying the UMI (must match tag written by tag_bam_barcodes.R)
    umi_tag: UB

    # Strip GEM-well suffix from barcode tags (e.g. ACGT-1 -> ACGT).
    # Enable when the tagged BAM carries suffixed barcodes.
    strip_barcode_suffix: true

    # Path to cell barcode whitelist used to subset the tagged BAM before
    # IsoQuant runs. Accepts {sample} as a placeholder.
    # Leave empty to fall back to blaze/{sample}_whitelist.csv automatically.
    # If neither is found, the full tagged BAM is passed through unchanged.
    cell_whitelist: ''

    # Maximum permitted relative divergence between the spliced + unspliced +
    # ambiguous molecule totals (derived from read_assignments) and IsoQuant's
    # native count matrix. A warning is emitted if any barcode exceeds this.
    reconcile_tolerance: 0.01

    # Reserved for a future upstream UMI correction step (not implemented).
    # Do not set to true; no custom collapse logic is present in this repo.
    pre_collapse: false

# -----------------------------------------------
# Splice QC settings
# -----------------------------------------------

splice_qc:
    # Multiplier applied to the median absolute deviation (MAD) of
    # unspliced_fraction to flag per-barcode outliers.
    mad_multiplier: 3.0

    # Memory per job
    memory: 4G

# -----------------------------------------------
# IsoQuant QC report (Streamlit app + static HTML export)
# -----------------------------------------------

isoquant_report:
    # Memory for headless HTML report generation
    memory: 16G

    # Write config.yaml alongside report.html for interactive Streamlit use
    write_config: true

# -----------------------------------------------
# Fusion calling (ctat-LR-fusion, containerised)
# -----------------------------------------------
# Opt-in: set call_fusions: true and run ``make fusions``.
# Requires a CTAT resource directory built against the same reference as
# genome_fasta / isoquant_gtf. Prebuilt bundles:
#   https://data.broadinstitute.org/Trinity/CTAT_RESOURCE_LIB/

fusion:
    call_fusions: false

    # Path to ctat-LR-fusion genome_lib_dir (must match reference annotation)
    ctat_resource_dir: /path/to/ctat_genome_lib

    # Container invocation prefix (Singularity example). Adjust image path.
    run_prefix: singularity exec --bind $PWD /path/to/ctat_lr_fusion.sif

    threads: 8
    memory: 16G

# -----------------------------------------------
# Targeted translocation scanning (split-mm port, single-cell)
# -----------------------------------------------
# Opt-in: set run: true and run ``make targeted_fusions``.
# Scans barcode-tagged BAM for reads supporting whitelist chromosome-pair
# windows and writes per-cell support tables and cell x translocation matrices.

targeted_fusion:
    run: false

    # TSV whitelist of translocation pairs (see pipeline_sclong/fusion_whitelist.tsv)
    whitelist: /path/to/fusion_whitelist.tsv

    # BAM source: cells = tagged_cells (true cells only); all = full tagged BAM
    bam_source: cells

    # Default window size for rows without per-row window_size (bp)
    window_size: 1000000

    # How pad_left / pad_right are interpreted: windows | bp
    padding_units: windows

    min_mapq: 20
    keep_secondary: false

    # Which window tier feeds the wide matrix outputs: exact | broad
    matrix_window: exact

    memory: 8G

# -----------------------------------------------
# Per-cell SNV calling (longshot, wf-single-cell port)
# -----------------------------------------------
# Opt-in: set call_variants: true and run ``make variants``.
# Heavy: wf-single-cell reports ~24h on 64 cores for ~1500 cells.

snv:
    call_variants: false

    threads: 8
    merge_threads: 8
    memory: 32G

    # Round-1 longshot thresholds (per-cell discovery)
    call1_min_alt_count: 1
    call1_min_cov: 1

    # Bulk longshot thresholds
    bulk_min_alt_count: 2
    bulk_min_cov: 2

    # Round-2 genotyping
    genotype2_min_alt_count: 1
    genotype2_min_cov: 1
    depth_target: 200

    # Optional VCF of variants of interest for genotype matrix filtering
    report_variants: ''

# -----------------------------------------------
# Cluster settings (for HPC environments)
# -----------------------------------------------

# Uncomment and modify for your cluster environment
# cluster:
#     queue: all.q
#     memory_resource: h_vmem
#     parallel_environment: smp
