[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isoquant-report"
version = "0.1.0"
description = "Interactive QC and exploration report for IsoQuant single-cell long-read RNA-seq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "plotly>=5.18",
    "kaleido>=0.2",
    "scanpy>=1.9",
    "anndata>=0.9",
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
isoquant-report = "isoquant_report.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["isoquant_report*"]
